[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wot-companion"
version = "0.1.0"
description = "Compagnon intelligent World of Tanks : coaching, aide a la decision et progression (moteur tactique deterministe)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "WoT Companion" }]
# Le coeur (moteur tactique, fairplay, profil) n'a AUCUNE dependance externe :
# il fonctionne avec la seule bibliotheque standard (sqlite3, json, dataclasses...).
dependencies = []

[project.optional-dependencies]
# Dependances facultatives, hors chemin critique du coaching live.
api = ["requests>=2.28"]     # integrations/wargaming_api
dev = ["pytest>=7.0"]

[project.scripts]
wot-companion-sim = "wot_companion.tools.run_simulation:main"
wot-companion-kbcheck = "wot_companion.tools.kb_check:main"

[tool.setuptools.packages.find]
include = ["wot_companion*"]

[tool.setuptools.package-data]
wot_companion = ["knowledge/**/*.json", "ui/*.json", "profile/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
